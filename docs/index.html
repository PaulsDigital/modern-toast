<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModernToast</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PaulsDigital/modern-toast@main/src/modern-toast.css">
  <style>
    :root {
      --bg: #f4f4f7;
      --panel: #ffffff;
      --line: rgba(24, 24, 32, 0.08);
      --text: #18181b;
      --muted: #71717a;
      --accent: #7c5cff;
      --field: #f7f7f9;
      font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(124, 92, 255, 0.14), transparent 50%),
        radial-gradient(900px 500px at -10% 100%, rgba(62, 207, 142, 0.1), transparent 50%),
        var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .side {
      border-right: 1px solid var(--line);
      padding: 28px 18px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
    }

    .brand {
      padding: 0 10px 22px;
    }

    .brand strong {
      display: block;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav button:hover,
    .nav button.is-active {
      background: rgba(24, 24, 32, 0.05);
    }

    .nav button small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .main {
      padding: 28px 32px 40px;
      max-width: 880px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.04em;
    }

    .top p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 0;
      height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 550;
      cursor: pointer;
      color: var(--text);
      background: rgba(24, 24, 32, 0.06);
    }

    .btn:hover { background: rgba(24, 24, 32, 0.1); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { filter: brightness(1.06); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(24, 24, 32, 0.04);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-head h2 {
      margin: 0;
    }

    .btn-quiet {
      height: 32px;
      padding: 0 12px;
      font-size: 0.78rem;
    }

    .code {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      color: #3f2d9c;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      overflow: auto;
      white-space: pre;
    }

    label.row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    label.row[hidden] { display: none; }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
      padding: 0 12px;
      outline: none;
    }

    input[type="text"],
    select { height: 40px; }

    textarea {
      min-height: 72px;
      padding: 10px 12px;
      resize: vertical;
    }

    .checks {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
    }

    .log {
      margin-top: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #5b3cc4;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      min-height: 92px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78em;
      background: rgba(24, 24, 32, 0.06);
      padding: 1px 6px;
      border-radius: 6px;
    }

    .corners {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .corners button {
      appearance: none;
      height: 36px;
      border: 1px solid var(--line);
      background: var(--field);
      border-radius: 10px;
      font: inherit;
      font-size: 0.72rem;
      color: var(--muted);
      cursor: pointer;
    }

    .corners button.is-on {
      background: rgba(124, 92, 255, 0.12);
      border-color: transparent;
      color: var(--text);
    }

    .is-html .text-only { display: none; }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .side { border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { flex-direction: row; overflow: auto; }
      .nav button { min-width: max-content; }
      .grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px 32px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <strong>ModernToast</strong>
        <span>Live playground</span>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1 id="heading">success</h1>
          <p id="lead">Pick a type, tweak options, then press Show.</p>
        </div>
        <div class="tools">
          <button class="btn" id="stackBtn" type="button">Show 3</button>
          <button class="btn" id="clearBtn" type="button">Dismiss all</button>
          <button class="btn btn-primary" id="showBtn" type="button">Show</button>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Content</h2>
          <label class="row">Title
            <input id="title" type="text">
          </label>
          <label class="row text-only">Text
            <textarea id="text"></textarea>
          </label>
          <label class="row html-only" hidden>HTML
            <textarea id="html"></textarea>
          </label>
        </section>

        <section class="card">
          <h2>Behavior</h2>
          <label class="row">Toast theme
            <select id="theme">
              <option value="auto">Auto</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <div class="row">
            <span style="font-size:0.8rem;color:var(--muted)">Position</span>
            <div class="corners" id="corners" style="margin-top:6px">
              <button type="button" data-pos="top-left">TL</button>
              <button type="button" data-pos="top-center">TC</button>
              <button type="button" data-pos="top-right">TR</button>
              <button type="button" data-pos="bottom-left">BL</button>
              <button type="button" data-pos="bottom-center">BC</button>
              <button type="button" data-pos="bottom-right">BR</button>
            </div>
          </div>
          <label class="row">Custom class
            <input id="customClass" type="text" placeholder="optional — on the card">
          </label>
          <div class="checks">
            <label><input id="closable" type="checkbox" checked> Close button</label>
            <label><input id="recede" type="checkbox" checked> Recede older toasts</label>
            <label><input id="pause" type="checkbox" checked> Pause on hover</label>
            <label><input id="sticky" type="checkbox"> Keep on screen</label>
          </div>
        </section>
      </div>

      <section class="card" style="margin-top: 16px">
        <div class="card-head">
          <h2>JavaScript</h2>
          <button class="btn btn-quiet" id="copyBtn" type="button">Copy</button>
        </div>
        <pre class="code" id="snippet"></pre>
      </section>

      <section class="card" style="margin-top: 16px">
        <h2>Dismiss result</h2>
        <div class="log" id="log">Press Show to open a toast.</div>
      </section>
      <p class="hint">Two files. <code>ModernToast.show()</code>. Light and dark.</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/PaulsDigital/modern-toast@main/src/modern-toast.js"></script>
  <script>
    const presets = {
      success: {
        label: 'success',
        note: 'Completed action',
        type: 'success',
        title: 'Saved',
        text: 'The file is already in the library.'
      },
      error: {
        label: 'error',
        note: 'Something failed',
        type: 'error',
        title: 'Could not save',
        text: 'Check your connection and try again.'
      },
      warning: {
        label: 'warning',
        note: 'Needs attention',
        type: 'warning',
        title: 'Unsaved changes',
        text: 'Leave now and the latest edits will be lost.'
      },
      info: {
        label: 'info',
        note: 'Neutral message',
        type: 'info',
        title: 'Sync is on',
        text: 'New versions will download automatically.'
      },
      html: {
        label: 'custom HTML',
        note: 'Markup inside',
        type: 'info',
        title: "What's new",
        html: '<p>You can pass <strong>your own markup</strong>.</p><p>Links like <a href="https://example.com">example.com</a> are allowed.</p>'
      },
      link: {
        label: 'link',
        note: 'Opens a URL',
        type: 'info',
        title: 'Release notes',
        text: 'Click the card to open the changelog.',
        href: 'https://example.com',
        hrefTarget: '_blank'
      }
    };

    const nav = document.getElementById('nav');
    const logEl = document.getElementById('log');
    const snippetEl = document.getElementById('snippet');
    const copyBtn = document.getElementById('copyBtn');
    const titleInput = document.getElementById('title');
    const textInput = document.getElementById('text');
    const htmlInput = document.getElementById('html');
    const themeInput = document.getElementById('theme');
    const customClassInput = document.getElementById('customClass');
    const closableInput = document.getElementById('closable');
    const recedeInput = document.getElementById('recede');
    const pauseInput = document.getElementById('pause');
    const stickyInput = document.getElementById('sticky');
    const htmlRow = document.querySelector('.html-only');
    const cornerBtns = [...document.querySelectorAll('#corners button')];
    let current = 'success';
    let position = 'top-right';

    Object.keys(presets).forEach((key) => {
      const item = presets[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.key = key;
      btn.innerHTML = item.label + '<small>' + item.note + '</small>';
      btn.addEventListener('click', () => {
        current = key;
        applyPreset(item);
        markNav();
        renderSnippet();
      });
      nav.appendChild(btn);
    });

    function markNav() {
      [...nav.children].forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.key === current);
      });
      document.getElementById('heading').textContent = presets[current].label;
      document.getElementById('lead').textContent = current === 'link'
        ? 'The card itself is the action. Close still works on the side.'
        : 'Pick a type, tweak options, then press Show.';
      document.querySelector('.app').classList.toggle('is-html', current === 'html');
      htmlRow.hidden = current !== 'html';
      markCorners();
    }

    function markCorners() {
      cornerBtns.forEach((btn) => {
        btn.classList.toggle('is-on', btn.dataset.pos === position);
      });
    }

    function applyPreset(item) {
      titleInput.value = item.title || '';
      textInput.value = item.text || '';
      htmlInput.value = item.html || '';
      stickyInput.checked = false;
    }

    cornerBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        position = btn.dataset.pos;
        markCorners();
        renderSnippet();
      });
    });

    function collect() {
      const preset = presets[current];
      const options = {
        type: preset.type,
        title: titleInput.value,
        theme: themeInput.value,
        position: position,
        closable: closableInput.checked,
        recede: recedeInput.checked,
        pauseOnHover: pauseInput.checked,
        duration: stickyInput.checked ? 0 : 4000
      };

      if (current === 'html') options.html = htmlInput.value;
      else options.text = textInput.value;

      if (customClassInput.value.trim()) options.customClass = customClassInput.value.trim();
      if (preset.href) {
        options.href = preset.href;
        options.hrefTarget = preset.hrefTarget;
      }

      return options;
    }

    function jsValue(value) {
      return JSON.stringify(value);
    }

    function formatOptions(options) {
      const omit = {
        theme: 'auto',
        position: 'top-right',
        duration: 4000,
        closable: true,
        recede: true,
        pauseOnHover: true
      };
      const order = [
        'type', 'title', 'text', 'html', 'theme', 'position',
        'duration', 'closable', 'recede', 'pauseOnHover',
        'href', 'hrefTarget', 'customClass'
      ];
      const props = [];

      order.forEach((key) => {
        if (!Object.prototype.hasOwnProperty.call(options, key)) return;
        const value = options[key];
        if (value == null || value === '') return;
        if (Object.prototype.hasOwnProperty.call(omit, key) && omit[key] === value) return;
        props.push(key + ': ' + jsValue(value));
      });

      return props.map((prop) => '  ' + prop).join(',\n');
    }

    function renderSnippet() {
      const options = collect();
      snippetEl.textContent = 'const toast = ModernToast.show({\n' + formatOptions(options) + '\n})';
    }

    function printResult(result) {
      logEl.textContent = JSON.stringify(result, null, 2);
    }

    async function launch(count) {
      const n = count || 1;
      let last;
      for (let i = 0; i < n; i += 1) {
        const options = collect();
        if (n > 1) {
          options.title = options.title + ' · ' + (i + 1);
        }
        last = ModernToast.show(options);
      }
      printResult(await last);
    }

    [
      titleInput, textInput, htmlInput, customClassInput,
      themeInput, closableInput, recedeInput, pauseInput, stickyInput
    ].forEach((el) => {
      el.addEventListener('input', renderSnippet);
      el.addEventListener('change', renderSnippet);
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(snippetEl.textContent);
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      } catch (err) {
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      }
    });

    document.getElementById('showBtn').addEventListener('click', () => launch(1));
    document.getElementById('stackBtn').addEventListener('click', () => launch(3));
    document.getElementById('clearBtn').addEventListener('click', async () => {
      printResult(await ModernToast.dismissAll());
    });

    applyPreset(presets.success);
    markNav();
    renderSnippet();
  </script>
</body>
</html>
